        function isExt(val, filename) {
          var f = typeof filename === 'string' ? filename : '';

        }

          if (isExt(e.reason)) { e.preventDefault(); e.stopImmediatePropagation(); }
        }, true);
        window.addEventListener('error', function (e) {
          if (isExt(e.error || e.message, e.filename)) { e.preventDefault(); e.stopImmediatePropagation(); }
        }, true);
        var origErr = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isExt(arguments[i])) return;
          }
          return origErr.apply(console, arguments);
        };
